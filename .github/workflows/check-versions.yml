name: Check for Updates

on:
  # Run every 6 hours
  schedule:
    - cron: '0 */6 * * *'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

  # Run on push to test the workflow
  push:
    branches:
      - master
    paths:
      - '.github/workflows/check-versions.yml'

permissions:
  contents: write

jobs:
  check-versions:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure git
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"

    - name: Check for version updates
      run: |
        chmod +x check_versions.sh
        # Auto-commits and pushes if changes detected. Success = no change
        # or update applied; a nonzero exit is a real error.
        ./check_versions.sh --update

    - name: Verify CI configuration
      if: always()
      run: |
        LAST=$(git log -1 --format=%ct)
        THRESHOLD=$(( $(date +%s) - 3888000 ))
        if [ "$LAST" -lt "$THRESHOLD" ]; then
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git commit --allow-empty -m "ci: refresh workflow configuration"
          git push
        fi
